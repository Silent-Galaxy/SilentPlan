<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SilentPlan Studio</title>
  <script type="module" crossorigin src="./assets/index-CB3fkkws.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DNP4uPv8.css">
</head>
<body>
  <div id="app">
    <!-- نوار ابزار بالا -->
    <header class="toolbar">
      <div class="logo">🎨 SilentPlan Studio</div>
      <div class="actions">
        <button id="btn-export-png" class="btn">🖼 خروجی PNG (باکیفیت)</button>
        <button id="btn-export-pdf" class="btn">📄 خروجی PDF</button>
        <button id="btn-export-plantuml" class="btn btn-accent">🌱 تبدیل به PlantUML</button>
      </div>
    </header>

    <div class="workspace">
      <!-- سایدبار شکل‌ها -->
      <aside class="sidebar">
        <h3>شکل‌ها (بکشید روی صفحه)</h3>
        <div class="shape-palette">
          <div class="shape-item" draggable="true" data-shape="actor">
            <span class="icon">👤</span>
            <span>اکتور (Actor)</span>
          </div>
          <div class="shape-item" draggable="true" data-shape="cloud">
            <span class="icon">☁️</span>
            <span>ابر (Cloud)</span>
          </div>
          <div class="shape-item" draggable="true" data-shape="database">
            <span class="icon">🗄️</span>
            <span>دیتابیس (DB)</span>
          </div>
          <div class="shape-item" draggable="true" data-shape="rect">
            <span class="icon">⏹️</span>
            <span>جعبه (Process)</span>
          </div>
        </div>
      </aside>

      <!-- محیط بوم و طراحی -->
      <main class="canvas-container" id="canvas-container">
        <!-- بوم Konva اینجا ساخته می‌شود -->
      </main>
    </div>
  </div>

</body>
</html>
